# OS1-64 Configuration
image_projection:
  ros__parameters:
    laser:
      num_vertical_scans: 64
      num_horizontal_scans: 1024         # 根據 OS1-64 的水平方向解析度
      vertical_angle_bottom: -31.5       # degrees，OS1-64 的垂直視場角為 -31.5° 到 10.5°
      vertical_angle_top: 10.5           # degrees
      sensor_mount_angle: 0.0            # degrees
      ground_scan_index: 40              # 調整地面掃描的起始線數（視需求調整）
      use_kitti: false
      use_vlp32c: false
      offline_path: "你的OS1-64資料集路徑"

    image_projection:
      segment_valid_point_num: 5
      segment_valid_line_num: 3
      segment_theta: 60.0                # 保持不變，但視情況可以減少此值以提高精度

map_optimization:
  ros__parameters:
    mapping:
      enable_loop_closure: true
      save_key_feature_pcd: false

      surrounding_keyframe_search_radius: 50.0
      surrounding_keyframe_search_num: 50

      history_keyframe_search_radius: 15.0  
      history_keyframe_search_num: 50        
      history_keyframe_fitness_score: 0.5    
      step_size: 1.0 
      stop_thres: 0.05 

      iterCountThres: 200

      global_map_visualization_search_radius: 5000.0 
      info_save_path: "/home/alex/colcon_ws/"

      PGO_cov_param: [1e-6, 1e-6, 1e-6, 1e-8, 1e-8, 1e-6]
      Ground_Plane_param: [1e-4, 1e-4, 1e-8]

transform_fusion:
  ros__parameters:
    mapping:
      pose_save_path: "/home/alex/colcon_ws/result.txt"

feature_association:
  ros__parameters:
    laser:
      num_vertical_scans: 64
      num_horizontal_scans: 1024           # 水平掃描數量
      scan_period: 0.1                     # seconds
      vertical_angle_bottom: -31.5         # degrees
      vertical_angle_top: 10.5             # degrees
      DBFr: 5.0
      RatioXY: 0.5 
      RatioZ: 2.5
      use_imu_undistortion: false          # 根據需求選擇是否使用 IMU 去畸變

    mapping:
      mapping_frequency_divider: 5

    featureAssociation:
      edge_threshold: 0.1
      surf_threshold: 0.05
      nearest_feature_search_distance: 5.0


